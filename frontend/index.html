<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Generator</title>
<style>
body { font-family: sans-serif; text-align: center; margin-top: 50px; }
input, button { padding: 8px; margin: 5px; font-size: 16px; }
#password { font-weight: bold; color: #2c3e50; }
</style>
</head>
<body>

<h2>Python Password Generator</h2>

<label>Length:</label>
<input type="number" id="length" value="12" min="6" max="64"><br>

<input type="checkbox" id="uppercase" checked> Uppercase<br>
<input type="checkbox" id="numbers" checked> Numbers<br>
<input type="checkbox" id="symbols" checked> Symbols<br>

<button onclick="generatePassword()">Generate</button>

<p id="password"></p>

<script>
async function generatePassword() {
    const length = parseInt(document.getElementById("length").value);
    const uppercase = document.getElementById("uppercase").checked;
    const numbers = document.getElementById("numbers").checked;
    const symbols = document.getElementById("symbols").checked;

    const response = await fetch("/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ length, uppercase, numbers, symbols })
    });

    const data = await response.json();
    document.getElementById("password").textContent = data.password;
}
</script>

</body>
</html>
